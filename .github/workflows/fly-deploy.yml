name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys must not overlap, and a newer one should wait rather than be dropped.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  FLY_APP: uffe-nemlig-mcp
  FLY_REGION: arn
  FLY_VOLUME: nemlig_data

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the app if it does not exist
        run: flyctl apps create "$FLY_APP" || true

      - name: Create the data volume if it does not exist
        run: |
          if flyctl volumes list --app "$FLY_APP" --json | jq -e --arg name "$FLY_VOLUME" 'any(.[]; .name == $name)' >/dev/null; then
            echo "Volume $FLY_VOLUME already exists."
          else
            flyctl volumes create "$FLY_VOLUME" --app "$FLY_APP" --region "$FLY_REGION" --size 1 --yes
          fi

      # One volume, one machine: --ha=false stops Fly from wanting a second one.
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false --app "$FLY_APP"

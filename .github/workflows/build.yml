name: Test

# Tests pull requests. Deploying main is fly-deploy.yml's job, which runs the same
# tests first; the image is built by Fly, so nothing is pushed to a registry here.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Builds, then walks every tool end to end over streamable HTTP against a
      # fake Nemlig — including token expiry and a restart.
      - run: npm test

# Fly.io deployment. Deployed by .github/workflows/fly-deploy.yml on every push to
# main. Secrets are set with `fly secrets set`, never here — see the README.

app = "uffe-nemlig-mcp"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  # Pin the server to the account in the Fly secrets; a client cannot swap it.
  NEMLIG_ALLOW_HEADER_CREDENTIALS = "false"
  NEMLIG_DATA_DIR = "/data"
  PORT = "8080"
  TZ = "Europe/Copenhagen"

[http_service]
  internal_port = 8080
  force_https = true
  # One always-on machine: sessions live in its memory, and a cold start would
  # cost every client a fresh Nemlig login.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[mounts]
  source = "nemlig_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"

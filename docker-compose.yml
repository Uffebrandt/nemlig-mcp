# Builds from this working copy — for developing on the image itself.
# To run the image built by CI instead, use deploy/docker-compose.yml.

services:
  nemlig-mcp:
    build: .
    image: nemlig-mcp:local
    container_name: nemlig-mcp
    restart: unless-stopped
    ports:
      # LAN only. The endpoint is /mcp/<MCP_PATH_SECRET>; everything else 404s.
      - "8089:8080"
    volumes:
      - nemlig-mcp-data:/data
    environment:
      TZ: Europe/Copenhagen
      NEMLIG_USERNAME: ${NEMLIG_USERNAME:?set NEMLIG_USERNAME in .env}
      NEMLIG_PASSWORD: ${NEMLIG_PASSWORD:?set NEMLIG_PASSWORD in .env}
      MCP_PATH_SECRET: ${MCP_PATH_SECRET:?set MCP_PATH_SECRET in .env}

volumes:
  nemlig-mcp-data:
